<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="860" viewBox="0 0 1280 860">
  <rect width="1280" height="860" fill="#ffffff"/>
  <style>
    .title { font-family: Arial, sans-serif; font-size: 25px; font-weight: 700; fill: #111; }
    .subtitle { font-family: Arial, sans-serif; font-size: 14px; fill: #555; }
    .panel { fill: #fbfbfb; stroke: #ddd; stroke-width: 1; }
    .panel-title { font-family: Arial, sans-serif; font-size: 18px; font-weight: 700; fill: #111; }
    .note { font-family: Arial, sans-serif; font-size: 12px; fill: #555; }
    .axis { stroke: #222; stroke-width: 1.8; }
    .grid { stroke: #e7e7e7; stroke-width: 1; }
    .tick { font-family: Arial, sans-serif; font-size: 11px; fill: #333; }
    .axis-label { font-family: Arial, sans-serif; font-size: 13px; font-weight: 700; fill: #333; }
    .bar-label { font-family: Arial, sans-serif; font-size: 12px; font-weight: 700; fill: #222; }
    .legend { font-family: Arial, sans-serif; font-size: 12px; fill: #333; }
    .base { fill: #2f80ed; }
    .opt { fill: #d13f2f; }
    .muted { fill: #d9e8ff; stroke: #2f80ed; stroke-width: 1; }
    .good { fill: #ffe1dc; stroke: #d13f2f; stroke-width: 1; }
    .line { fill: none; stroke-width: 3.5; stroke-linejoin: round; stroke-linecap: round; }
  </style>

  <text x="640" y="36" text-anchor="middle" class="title">Paper Evaluation: Per-Optimization Paired Ablation Sketch</text>
  <text x="640" y="62" text-anchor="middle" class="subtitle">Each optimization uses the interface.sh workload that best exposes its benefit; values are placeholders until replaced by real results.</text>

  <g transform="translate(45,95)">
    <rect class="panel" x="0" y="0" width="570" height="325"/>
    <text x="18" y="31" class="panel-title">A. Paired Throughput Improvement</text>
    <text x="18" y="53" class="note">baseline = TerarkDB with all paper optimizations disabled; optimized = one optimization enabled</text>
    <g transform="translate(70,76)">
      <rect x="0" y="0" width="445" height="195" fill="#fff" stroke="#eee"/>
      <g class="grid"><line x1="0" y1="156" x2="445" y2="156"/><line x1="0" y1="117" x2="445" y2="117"/><line x1="0" y1="78" x2="445" y2="78"/><line x1="0" y1="39" x2="445" y2="39"/></g>
      <line class="axis" x1="0" y1="195" x2="445" y2="195"/><line class="axis" x1="0" y1="0" x2="0" y2="195"/>
      <g>
        <rect class="base" x="40" y="65" width="27" height="130"/><rect class="opt" x="70" y="24" width="27" height="171"/><text x="83" y="16" text-anchor="middle" class="bar-label">1.32×</text>
        <rect class="base" x="145" y="65" width="27" height="130"/><rect class="opt" x="175" y="33" width="27" height="162"/><text x="188" y="25" text-anchor="middle" class="bar-label">1.25×</text>
        <rect class="base" x="250" y="65" width="27" height="130"/><rect class="opt" x="280" y="40" width="27" height="155"/><text x="293" y="32" text-anchor="middle" class="bar-label">1.19×</text>
        <rect class="base" x="355" y="65" width="27" height="130"/><rect class="opt" x="385" y="29" width="27" height="166"/><text x="398" y="21" text-anchor="middle" class="bar-label">1.28×</text>
      </g>
      <g class="tick">
        <text x="-10" y="199" text-anchor="end">0</text><text x="-10" y="134" text-anchor="end">0.5</text><text x="-10" y="69" text-anchor="end">1.0</text><text x="-10" y="4" text-anchor="end">1.5</text>
        <text x="68" y="216" text-anchor="middle">hotness</text><text x="173" y="216" text-anchor="middle">gc-cache</text><text x="278" y="216" text-anchor="middle">delta</text><text x="383" y="216" text-anchor="middle">precise GC</text>
      </g>
      <text x="222" y="250" text-anchor="middle" class="axis-label">optimization target</text>
      <text x="-48" y="98" transform="rotate(-90 -48 98)" text-anchor="middle" class="axis-label">ops/sec, normalized</text>
      <rect x="290" y="13" width="12" height="12" class="base"/><text x="308" y="23" class="legend">baseline</text>
      <rect x="372" y="13" width="12" height="12" class="opt"/><text x="390" y="23" class="legend">optimized</text>
    </g>
  </g>

  <g transform="translate(665,95)">
    <rect class="panel" x="0" y="0" width="570" height="325"/>
    <text x="18" y="31" class="panel-title">B. Paired Latency Reduction</text>
    <text x="18" y="53" class="note">lower is better; use mean latency from summary.tsv, and replace with p99 if histogram parser is added</text>
    <g transform="translate(70,76)">
      <rect x="0" y="0" width="445" height="195" fill="#fff" stroke="#eee"/>
      <g class="grid"><line x1="0" y1="156" x2="445" y2="156"/><line x1="0" y1="117" x2="445" y2="117"/><line x1="0" y1="78" x2="445" y2="78"/><line x1="0" y1="39" x2="445" y2="39"/></g>
      <line class="axis" x1="0" y1="195" x2="445" y2="195"/><line class="axis" x1="0" y1="0" x2="0" y2="195"/>
      <g>
        <rect class="base" x="40" y="65" width="27" height="130"/><rect class="opt" x="70" y="107" width="27" height="88"/><text x="83" y="99" text-anchor="middle" class="bar-label">0.68×</text>
        <rect class="base" x="145" y="65" width="27" height="130"/><rect class="opt" x="175" y="101" width="27" height="94"/><text x="188" y="93" text-anchor="middle" class="bar-label">0.72×</text>
        <rect class="base" x="250" y="65" width="27" height="130"/><rect class="opt" x="280" y="88" width="27" height="107"/><text x="293" y="80" text-anchor="middle" class="bar-label">0.82×</text>
        <rect class="base" x="355" y="65" width="27" height="130"/><rect class="opt" x="385" y="104" width="27" height="91"/><text x="398" y="96" text-anchor="middle" class="bar-label">0.70×</text>
      </g>
      <g class="tick">
        <text x="-10" y="199" text-anchor="end">0</text><text x="-10" y="134" text-anchor="end">0.5</text><text x="-10" y="69" text-anchor="end">1.0</text><text x="-10" y="4" text-anchor="end">1.5</text>
        <text x="68" y="216" text-anchor="middle">hotness</text><text x="173" y="216" text-anchor="middle">gc-cache</text><text x="278" y="216" text-anchor="middle">delta</text><text x="383" y="216" text-anchor="middle">precise GC</text>
      </g>
      <text x="222" y="250" text-anchor="middle" class="axis-label">optimization target</text>
      <text x="-48" y="98" transform="rotate(-90 -48 98)" text-anchor="middle" class="axis-label">latency, normalized</text>
      <rect x="290" y="13" width="12" height="12" class="base"/><text x="308" y="23" class="legend">baseline</text>
      <rect x="372" y="13" width="12" height="12" class="opt"/><text x="390" y="23" class="legend">optimized</text>
    </g>
  </g>

  <g transform="translate(45,465)">
    <rect class="panel" x="0" y="0" width="570" height="325"/>
    <text x="18" y="31" class="panel-title">C. Mechanism-Specific Benefit</text>
    <text x="18" y="53" class="note">each metric should be extracted from stats/logs matching that optimization</text>
    <g transform="translate(72,78)">
      <rect x="0" y="0" width="435" height="190" fill="#fff" stroke="#eee"/>
      <g class="grid"><line x1="0" y1="152" x2="435" y2="152"/><line x1="0" y1="114" x2="435" y2="114"/><line x1="0" y1="76" x2="435" y2="76"/><line x1="0" y1="38" x2="435" y2="38"/></g>
      <line class="axis" x1="0" y1="190" x2="435" y2="190"/><line class="axis" x1="0" y1="0" x2="0" y2="190"/>
      <rect class="muted" x="42" y="57" width="42" height="133"/><rect class="good" x="89" y="128" width="42" height="62"/><text x="110" y="120" text-anchor="middle" class="bar-label">-53%</text>
      <rect class="muted" x="150" y="57" width="42" height="133"/><rect class="good" x="197" y="118" width="42" height="72"/><text x="218" y="110" text-anchor="middle" class="bar-label">+46%</text>
      <rect class="muted" x="258" y="57" width="42" height="133"/><rect class="good" x="305" y="138" width="42" height="52"/><text x="326" y="130" text-anchor="middle" class="bar-label">-61%</text>
      <rect class="muted" x="366" y="57" width="42" height="133"/><rect class="good" x="413" y="112" width="42" height="78" transform="translate(-35,0)"/><text x="399" y="104" text-anchor="middle" class="bar-label">+41%</text>
      <g class="tick">
        <text x="-10" y="194" text-anchor="end">0</text><text x="-10" y="118" text-anchor="end">0.4</text><text x="-10" y="42" text-anchor="end">0.8</text>
        <text x="87" y="211" text-anchor="middle">GC read bytes</text><text x="194" y="211" text-anchor="middle">cache hit rate</text><text x="302" y="211" text-anchor="middle">relocation writes</text><text x="386" y="211" text-anchor="middle">reclaim precision</text>
      </g>
      <text x="217" y="245" text-anchor="middle" class="axis-label">diagnostic metric</text>
      <text x="-48" y="95" transform="rotate(-90 -48 95)" text-anchor="middle" class="axis-label">normalized cost / benefit</text>
    </g>
  </g>

  <g transform="translate(665,465)">
    <rect class="panel" x="0" y="0" width="570" height="325"/>
    <text x="18" y="31" class="panel-title">D. Workload Matrix Used by interface.sh</text>
    <text x="18" y="53" class="note">keeps the ablation figure defensible: each pair isolates one mechanism under its target workload</text>
    <g transform="translate(42,80)">
      <rect x="0" y="0" width="486" height="198" fill="#fff" stroke="#eee"/>
      <g font-family="Arial, sans-serif" font-size="13" fill="#222">
        <rect x="0" y="0" width="486" height="34" fill="#f0f0f0"/>
        <text x="16" y="22" font-weight="700">pair</text><text x="150" y="22" font-weight="700">workload</text><text x="315" y="22" font-weight="700">dominant signal</text>
        <line x1="0" y1="34" x2="486" y2="34" stroke="#ddd"/>
        <text x="16" y="64">hotness</text><text x="150" y="64">overwrite-zipf1.2</text><text x="315" y="64">less vSST mixing</text>
        <line x1="0" y1="84" x2="486" y2="84" stroke="#eee"/>
        <text x="16" y="114">gc-cache</text><text x="150" y="114">workloadb</text><text x="315" y="114">higher useful hit rate</text>
        <line x1="0" y1="134" x2="486" y2="134" stroke="#eee"/>
        <text x="16" y="164">delta</text><text x="150" y="164">overwrite-zipf</text><text x="315" y="164">fewer large rewrites</text>
        <line x1="0" y1="184" x2="486" y2="184" stroke="#eee"/>
        <text x="16" y="214">precise GC</text><text x="150" y="214">overwrite-zipf1.2 + uniform_fixed</text><text x="315" y="214">byte-accurate reclaim</text>
      </g>
    </g>
  </g>

  <text x="640" y="828" text-anchor="middle" class="note">Use A/B as the main ablation figure; C/D can move to appendix after replacing placeholders with real log metrics.</text>
</svg>
