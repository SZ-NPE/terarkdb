<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760">
  <rect width="1280" height="760" fill="#ffffff"/>
  <style>
    .title { font-family: Arial, sans-serif; font-size: 25px; font-weight: 700; fill: #111; }
    .subtitle { font-family: Arial, sans-serif; font-size: 14px; fill: #555; }
    .panel { fill: #fbfbfb; stroke: #ddd; stroke-width: 1; }
    .panel-title { font-family: Arial, sans-serif; font-size: 18px; font-weight: 700; fill: #111; }
    .note { font-family: Arial, sans-serif; font-size: 12px; fill: #555; }
    .axis { stroke: #222; stroke-width: 1.8; }
    .grid { stroke: #e7e7e7; stroke-width: 1; }
    .tick { font-family: Arial, sans-serif; font-size: 11px; fill: #333; }
    .axis-label { font-family: Arial, sans-serif; font-size: 13px; font-weight: 700; fill: #333; }
    .bar-label { font-family: Arial, sans-serif; font-size: 12px; font-weight: 700; fill: #222; }
    .legend { font-family: Arial, sans-serif; font-size: 12px; fill: #333; }
    .rocks { fill: #7f8c8d; }
    .blob { fill: #9b59b6; }
    .base { fill: #2f80ed; }
    .full { fill: #d13f2f; }
  </style>

  <text x="640" y="36" text-anchor="middle" class="title">Paper Evaluation: Overall Comparison 预期结果图</text>
  <text x="640" y="62" text-anchor="middle" class="subtitle">示意最终论文评估版式：RocksDB / BlobDB / TerarkDB baseline / TerarkDB full；数值为预期趋势占位，等待真实实验替换</text>

  <g transform="translate(45,95)">
    <rect class="panel" x="0" y="0" width="570" height="285"/>
    <text x="18" y="31" class="panel-title">A. Normalized Throughput</text>
    <text x="18" y="53" class="note">overall_* cases, workload = overwrite-zipf, baseline normalized to TerarkDB-base</text>
    <g transform="translate(72,75)">
      <rect x="0" y="0" width="435" height="160" fill="#fff" stroke="#eee"/>
      <g class="grid"><line x1="0" y1="128" x2="435" y2="128"/><line x1="0" y1="96" x2="435" y2="96"/><line x1="0" y1="64" x2="435" y2="64"/><line x1="0" y1="32" x2="435" y2="32"/></g>
      <line class="axis" x1="0" y1="160" x2="435" y2="160"/><line class="axis" x1="0" y1="0" x2="0" y2="160"/>
      <rect class="rocks" x="35" y="91" width="52" height="69"/><text x="61" y="83" text-anchor="middle" class="bar-label">0.65×</text>
      <rect class="blob" x="135" y="73" width="52" height="87"/><text x="161" y="65" text-anchor="middle" class="bar-label">0.82×</text>
      <rect class="base" x="235" y="53" width="52" height="107"/><text x="261" y="45" text-anchor="middle" class="bar-label">1.00×</text>
      <rect class="full" x="335" y="5" width="52" height="155"/><text x="361" y="-3" text-anchor="middle" class="bar-label">1.45×</text>
      <g class="tick">
        <text x="-10" y="164" text-anchor="end">0</text><text x="-10" y="110" text-anchor="end">0.5</text><text x="-10" y="57" text-anchor="end">1.0</text><text x="-10" y="4" text-anchor="end">1.5</text>
        <text x="61" y="181" text-anchor="middle">RocksDB</text><text x="161" y="181" text-anchor="middle">BlobDB</text><text x="261" y="181" text-anchor="middle">TDB-base</text><text x="361" y="181" text-anchor="middle">TDB-full</text>
      </g>
      <text x="217" y="214" text-anchor="middle" class="axis-label">system</text>
      <text x="-48" y="80" transform="rotate(-90 -48 80)" text-anchor="middle" class="axis-label">ops/sec, normalized</text>
    </g>
  </g>

  <g transform="translate(665,95)">
    <rect class="panel" x="0" y="0" width="570" height="285"/>
    <text x="18" y="31" class="panel-title">B. Normalized Mean Latency</text>
    <text x="18" y="53" class="note">lower is better; drawn from micros/op in summary.tsv</text>
    <g transform="translate(72,75)">
      <rect x="0" y="0" width="435" height="160" fill="#fff" stroke="#eee"/>
      <g class="grid"><line x1="0" y1="128" x2="435" y2="128"/><line x1="0" y1="96" x2="435" y2="96"/><line x1="0" y1="64" x2="435" y2="64"/><line x1="0" y1="32" x2="435" y2="32"/></g>
      <line class="axis" x1="0" y1="160" x2="435" y2="160"/><line class="axis" x1="0" y1="0" x2="0" y2="160"/>
      <rect class="rocks" x="35" y="16" width="52" height="144"/><text x="61" y="8" text-anchor="middle" class="bar-label">1.35×</text>
      <rect class="blob" x="135" y="34" width="52" height="126"/><text x="161" y="26" text-anchor="middle" class="bar-label">1.18×</text>
      <rect class="base" x="235" y="53" width="52" height="107"/><text x="261" y="45" text-anchor="middle" class="bar-label">1.00×</text>
      <rect class="full" x="335" y="94" width="52" height="66"/><text x="361" y="86" text-anchor="middle" class="bar-label">0.62×</text>
      <g class="tick">
        <text x="-10" y="164" text-anchor="end">0</text><text x="-10" y="110" text-anchor="end">0.5</text><text x="-10" y="57" text-anchor="end">1.0</text><text x="-10" y="4" text-anchor="end">1.5</text>
        <text x="61" y="181" text-anchor="middle">RocksDB</text><text x="161" y="181" text-anchor="middle">BlobDB</text><text x="261" y="181" text-anchor="middle">TDB-base</text><text x="361" y="181" text-anchor="middle">TDB-full</text>
      </g>
      <text x="217" y="214" text-anchor="middle" class="axis-label">system</text>
      <text x="-48" y="80" transform="rotate(-90 -48 80)" text-anchor="middle" class="axis-label">micros/op, normalized</text>
    </g>
  </g>

  <g transform="translate(45,425)">
    <rect class="panel" x="0" y="0" width="570" height="285"/>
    <text x="18" y="31" class="panel-title">C. Background GC / Compaction Read Cost</text>
    <text x="18" y="53" class="note">expected lower read amplification from hotter placement and GC-aware cache</text>
    <g transform="translate(72,75)">
      <rect x="0" y="0" width="435" height="160" fill="#fff" stroke="#eee"/>
      <g class="grid"><line x1="0" y1="128" x2="435" y2="128"/><line x1="0" y1="96" x2="435" y2="96"/><line x1="0" y1="64" x2="435" y2="64"/><line x1="0" y1="32" x2="435" y2="32"/></g>
      <line class="axis" x1="0" y1="160" x2="435" y2="160"/><line class="axis" x1="0" y1="0" x2="0" y2="160"/>
      <rect class="rocks" x="35" y="37" width="52" height="123"/><text x="61" y="29" text-anchor="middle" class="bar-label">1.15×</text>
      <rect class="blob" x="135" y="58" width="52" height="102"/><text x="161" y="50" text-anchor="middle" class="bar-label">0.95×</text>
      <rect class="base" x="235" y="53" width="52" height="107"/><text x="261" y="45" text-anchor="middle" class="bar-label">1.00×</text>
      <rect class="full" x="335" y="101" width="52" height="59"/><text x="361" y="93" text-anchor="middle" class="bar-label">0.55×</text>
      <g class="tick">
        <text x="-10" y="164" text-anchor="end">0</text><text x="-10" y="110" text-anchor="end">0.5</text><text x="-10" y="57" text-anchor="end">1.0</text><text x="-10" y="4" text-anchor="end">1.5</text>
        <text x="61" y="181" text-anchor="middle">RocksDB</text><text x="161" y="181" text-anchor="middle">BlobDB</text><text x="261" y="181" text-anchor="middle">TDB-base</text><text x="361" y="181" text-anchor="middle">TDB-full</text>
      </g>
      <text x="217" y="214" text-anchor="middle" class="axis-label">system</text>
      <text x="-48" y="80" transform="rotate(-90 -48 80)" text-anchor="middle" class="axis-label">bytes read, normalized</text>
    </g>
  </g>

  <g transform="translate(665,425)">
    <rect class="panel" x="0" y="0" width="570" height="285"/>
    <text x="18" y="31" class="panel-title">D. Space Footprint After Updates</text>
    <text x="18" y="53" class="note">KV separation plus more precise reclamation should reduce final on-disk footprint</text>
    <g transform="translate(72,75)">
      <rect x="0" y="0" width="435" height="160" fill="#fff" stroke="#eee"/>
      <g class="grid"><line x1="0" y1="128" x2="435" y2="128"/><line x1="0" y1="96" x2="435" y2="96"/><line x1="0" y1="64" x2="435" y2="64"/><line x1="0" y1="32" x2="435" y2="32"/></g>
      <line class="axis" x1="0" y1="160" x2="435" y2="160"/><line class="axis" x1="0" y1="0" x2="0" y2="160"/>
      <rect class="rocks" x="35" y="53" width="52" height="107"/><text x="61" y="45" text-anchor="middle" class="bar-label">1.00×</text>
      <rect class="blob" x="135" y="82" width="52" height="78"/><text x="161" y="74" text-anchor="middle" class="bar-label">0.73×</text>
      <rect class="base" x="235" y="87" width="52" height="73"/><text x="261" y="79" text-anchor="middle" class="bar-label">0.68×</text>
      <rect class="full" x="335" y="101" width="52" height="59"/><text x="361" y="93" text-anchor="middle" class="bar-label">0.55×</text>
      <g class="tick">
        <text x="-10" y="164" text-anchor="end">0</text><text x="-10" y="110" text-anchor="end">0.5</text><text x="-10" y="57" text-anchor="end">1.0</text><text x="-10" y="4" text-anchor="end">1.5</text>
        <text x="61" y="181" text-anchor="middle">RocksDB</text><text x="161" y="181" text-anchor="middle">BlobDB</text><text x="261" y="181" text-anchor="middle">TDB-base</text><text x="361" y="181" text-anchor="middle">TDB-full</text>
      </g>
      <text x="217" y="214" text-anchor="middle" class="axis-label">system</text>
      <text x="-48" y="80" transform="rotate(-90 -48 80)" text-anchor="middle" class="axis-label">disk bytes, normalized</text>
    </g>
  </g>

  <g transform="translate(420,724)">
    <rect x="0" y="-12" width="12" height="12" class="rocks"/><text x="18" y="-2" class="legend">RocksDB</text>
    <rect x="105" y="-12" width="12" height="12" class="blob"/><text x="123" y="-2" class="legend">BlobDB</text>
    <rect x="205" y="-12" width="12" height="12" class="base"/><text x="223" y="-2" class="legend">TerarkDB baseline</text>
    <rect x="365" y="-12" width="12" height="12" class="full"/><text x="383" y="-2" class="legend">TerarkDB full</text>
  </g>
</svg>
