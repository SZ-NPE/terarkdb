<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620">
  <rect width="1100" height="620" fill="#ffffff"/>
  <text x="550" y="36" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700">M3 预期图：GC 期间前台性能与后台 GC I/O 时间线</text>
  <text x="550" y="62" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="#555">同一时间轴上叠加前台 P99 延迟曲线与每次 Blob GC 的读 I/O 区间；GC 高读带宽区间对应前台尾延迟抬升</text>

  <!-- Plot area -->
  <rect x="105" y="90" width="840" height="410" fill="#fbfbfb" stroke="#ddd"/>

  <!-- GC shaded windows -->
  <rect x="309" y="90" width="95" height="410" fill="#ffd9b3" opacity="0.38"/>
  <rect x="644" y="90" width="120" height="410" fill="#ffd9b3" opacity="0.38"/>
  <text x="356" y="108" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#9a4b00">GC job #1</text>
  <text x="704" y="108" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="#9a4b00">GC job #2</text>

  <!-- Grid horizontal -->
  <g stroke="#e6e6e6" stroke-width="1">
    <line x1="105" y1="500" x2="945" y2="500"/>
    <line x1="105" y1="418" x2="945" y2="418"/>
    <line x1="105" y1="336" x2="945" y2="336"/>
    <line x1="105" y1="254" x2="945" y2="254"/>
    <line x1="105" y1="172" x2="945" y2="172"/>
    <line x1="105" y1="90" x2="945" y2="90"/>
  </g>

  <!-- Grid vertical -->
  <g stroke="#eeeeee" stroke-width="1">
    <line x1="105" y1="90" x2="105" y2="500"/>
    <line x1="245" y1="90" x2="245" y2="500"/>
    <line x1="385" y1="90" x2="385" y2="500"/>
    <line x1="525" y1="90" x2="525" y2="500"/>
    <line x1="665" y1="90" x2="665" y2="500"/>
    <line x1="805" y1="90" x2="805" y2="500"/>
    <line x1="945" y1="90" x2="945" y2="500"/>
  </g>

  <!-- Axes -->
  <line x1="105" y1="500" x2="945" y2="500" stroke="#222" stroke-width="2"/>
  <line x1="105" y1="90" x2="105" y2="500" stroke="#222" stroke-width="2"/>
  <line x1="945" y1="90" x2="945" y2="500" stroke="#222" stroke-width="2"/>

  <!-- Left Y labels: P99 latency -->
  <g font-family="Arial, sans-serif" font-size="12" fill="#333">
    <text x="96" y="504" text-anchor="end">0</text>
    <text x="96" y="422" text-anchor="end">10</text>
    <text x="96" y="340" text-anchor="end">20</text>
    <text x="96" y="258" text-anchor="end">30</text>
    <text x="96" y="176" text-anchor="end">40</text>
    <text x="96" y="94" text-anchor="end">50</text>
  </g>
  <text x="35" y="295" transform="rotate(-90 35 295)" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#c23b22" font-weight="700">前台 P99 延迟（ms）</text>

  <!-- Right Y labels: GC bandwidth -->
  <g font-family="Arial, sans-serif" font-size="12" fill="#333">
    <text x="955" y="504">0</text>
    <text x="955" y="422">200</text>
    <text x="955" y="340">400</text>
    <text x="955" y="258">600</text>
    <text x="955" y="176">800</text>
    <text x="955" y="94">1000</text>
  </g>
  <text x="1025" y="295" transform="rotate(90 1025 295)" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#2458a6" font-weight="700">GC 读带宽（MB/s）</text>

  <!-- X labels -->
  <g font-family="Arial, sans-serif" font-size="12" fill="#333">
    <text x="105" y="522" text-anchor="middle">0</text>
    <text x="245" y="522" text-anchor="middle">30</text>
    <text x="385" y="522" text-anchor="middle">60</text>
    <text x="525" y="522" text-anchor="middle">90</text>
    <text x="665" y="522" text-anchor="middle">120</text>
    <text x="805" y="522" text-anchor="middle">150</text>
    <text x="945" y="522" text-anchor="middle">180</text>
  </g>
  <text x="525" y="555" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#333" font-weight="700">时间（s）</text>

  <!-- Stacked GC bandwidth bars inside GC windows. Scale: 1000 MB/s -> 410 px. -->
  <g opacity="0.88">
    <!-- GC job #1 around 44-64s -->
    <rect x="314" y="266" width="16" height="234" fill="#2f80ed"/>
    <rect x="314" y="209" width="16" height="57" fill="#56ccf2"/>
    <rect x="336" y="238" width="16" height="262" fill="#2f80ed"/>
    <rect x="336" y="176" width="16" height="62" fill="#56ccf2"/>
    <rect x="358" y="225" width="16" height="275" fill="#2f80ed"/>
    <rect x="358" y="164" width="16" height="61" fill="#56ccf2"/>
    <rect x="380" y="283" width="16" height="217" fill="#2f80ed"/>
    <rect x="380" y="229" width="16" height="54" fill="#56ccf2"/>

    <!-- GC job #2 around 116-145s -->
    <rect x="650" y="254" width="16" height="246" fill="#2f80ed"/>
    <rect x="650" y="193" width="16" height="61" fill="#56ccf2"/>
    <rect x="672" y="229" width="16" height="271" fill="#2f80ed"/>
    <rect x="672" y="164" width="16" height="65" fill="#56ccf2"/>
    <rect x="694" y="213" width="16" height="287" fill="#2f80ed"/>
    <rect x="694" y="143" width="16" height="70" fill="#56ccf2"/>
    <rect x="716" y="234" width="16" height="266" fill="#2f80ed"/>
    <rect x="716" y="172" width="16" height="62" fill="#56ccf2"/>
    <rect x="738" y="287" width="16" height="213" fill="#2f80ed"/>
    <rect x="738" y="230" width="16" height="57" fill="#56ccf2"/>
  </g>

  <!-- Foreground P99 latency line -->
  <polyline fill="none" stroke="#d13f2f" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"
    points="105,475 140,472 175,476 210,473 245,471 280,474 306,468 320,412 338,295 356,210 374,252 392,352 410,438 445,468 480,474 515,472 550,475 585,471 620,470 640,462 658,390 676,278 694,170 712,190 730,245 748,332 766,425 805,466 840,474 875,472 910,475 945,471"/>
  <circle cx="356" cy="210" r="5" fill="#d13f2f"/>
  <circle cx="694" cy="170" r="5" fill="#d13f2f"/>

  <!-- Normal latency guide -->
  <line x1="105" y1="472" x2="945" y2="472" stroke="#d13f2f" stroke-width="1" stroke-dasharray="5 5" opacity="0.45"/>
  <text x="112" y="463" font-family="Arial, sans-serif" font-size="12" fill="#a33">无 GC 时低尾延迟基线</text>

  <!-- Legend -->
  <rect x="135" y="575" width="18" height="6" fill="#d13f2f"/>
  <text x="160" y="582" font-family="Arial, sans-serif" font-size="13" fill="#333">前台 P99 延迟</text>
  <rect x="300" y="569" width="18" height="14" fill="#2f80ed" opacity="0.88"/>
  <text x="325" y="582" font-family="Arial, sans-serif" font-size="13" fill="#333">GC vSST scan read</text>
  <rect x="480" y="569" width="18" height="14" fill="#56ccf2" opacity="0.88"/>
  <text x="505" y="582" font-family="Arial, sans-serif" font-size="13" fill="#333">GC kSST lookup read</text>
  <rect x="660" y="569" width="18" height="14" fill="#ffd9b3" opacity="0.55"/>
  <text x="685" y="582" font-family="Arial, sans-serif" font-size="13" fill="#333">GC 活跃区间</text>

  <!-- Annotation -->
  <path d="M760 160 C850 160, 850 230, 760 230" fill="none" stroke="#666" stroke-dasharray="4 4"/>
  <text x="790" y="150" font-family="Arial, sans-serif" font-size="13" fill="#333">预期结论：</text>
  <text x="790" y="170" font-family="Arial, sans-serif" font-size="13" fill="#333">GC scan/lookup 读带宽越高，</text>
  <text x="790" y="190" font-family="Arial, sans-serif" font-size="13" fill="#333">前台 P99 延迟同步抬升。</text>
</svg>
