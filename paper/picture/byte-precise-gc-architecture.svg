<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 720" font-family="'Helvetica Neue','Noto Sans CJK SC','PingFang SC','Microsoft YaHei',Arial,sans-serif">
  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="6" refY="3.2" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L6.5,3.2 L0,6.4 Z" fill="#8a96a3"/>
    </marker>
    <marker id="arq" markerWidth="9" markerHeight="9" refX="6" refY="3.2" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L6.5,3.2 L0,6.4 Z" fill="#7a9bbf"/>
    </marker>
  </defs>

  <!-- ===== title ===== -->
  <text x="40" y="38" font-size="19" font-weight="700" fill="#3a4250">Byte-Precise Blob GC</text>
  <text x="40" y="58" font-size="12.5" fill="#9aa3ad">Drive GC candidate selection by reclaimable bytes instead of dead-entry count.</text>

  <!-- ===== switch group brackets ===== -->
  <path d="M40,92 v-9 h483 v9" fill="none" stroke="#86b29a" stroke-width="1.3"/>
  <rect x="218" y="66" width="128" height="18" rx="9" fill="#86b29a"/>
  <text x="282" y="79" text-anchor="middle" font-size="11.5" font-weight="700" fill="#fff">use_delta_block</text>

  <path d="M556,92 v-9 h483 v9" fill="none" stroke="#d8ad84" stroke-width="1.3"/>
  <rect x="734" y="66" width="128" height="18" rx="9" fill="#d8ad84"/>
  <text x="798" y="79" text-anchor="middle" font-size="11.5" font-weight="700" fill="#fff">precise_gc</text>

  <!-- ===== pipeline boxes ===== -->
  <g>
    <rect x="40" y="100" width="225" height="78" rx="7" fill="#eff6f2" stroke="#9cc4ac" stroke-width="1.4"/>
    <text x="54" y="124" font-size="12.5" font-weight="700" fill="#4f7a62">① Write / Compaction</text>
    <text x="54" y="146" font-size="11.5" fill="#5b6470">Delta block records</text>
    <text x="54" y="164" font-size="11.5" fill="#5b6470">real separated-value bytes</text>
  </g>
  <g>
    <rect x="298" y="100" width="225" height="78" rx="7" fill="#eff6f2" stroke="#9cc4ac" stroke-width="1.4"/>
    <text x="312" y="124" font-size="12.5" font-weight="700" fill="#4f7a62">② Reference Accounting</text>
    <text x="312" y="146" font-size="11.5" fill="#5b6470">Aggregate kSST→vSST bytes</text>
    <text x="312" y="164" font-size="11.5" fill="#9aa3ad">Dependence.byte_count</text>
  </g>
  <g>
    <rect x="556" y="100" width="225" height="78" rx="7" fill="#faf4ec" stroke="#dcb78f" stroke-width="1.4"/>
    <text x="570" y="124" font-size="12.5" font-weight="700" fill="#a9744a">③ Version Accounting</text>
    <text x="570" y="146" font-size="11.5" fill="#5b6470">Dead bytes per vSST</text>
    <text x="570" y="164" font-size="11.5" fill="#9aa3ad">= total bytes - referenced bytes</text>
  </g>
  <g>
    <rect x="814" y="100" width="225" height="78" rx="7" fill="#faf4ec" stroke="#dcb78f" stroke-width="1.4"/>
    <text x="828" y="124" font-size="12.5" font-weight="700" fill="#a9744a">④ GC Picker</text>
    <text x="828" y="146" font-size="11.5" fill="#5b6470">Score by bytes</text>
    <text x="828" y="164" font-size="11.5" fill="#9aa3ad">Pick dirtiest vSSTs</text>
  </g>

  <!-- pipeline arrows -->
  <line x1="265" y1="139" x2="296" y2="139" stroke="#8a96a3" stroke-width="1.6" marker-end="url(#ar)"/>
  <line x1="523" y1="139" x2="554" y2="139" stroke="#8a96a3" stroke-width="1.6" marker-end="url(#ar)"/>
  <line x1="781" y1="139" x2="812" y2="139" stroke="#8a96a3" stroke-width="1.6" marker-end="url(#ar)"/>

  <!-- score chip -->
  <line x1="926" y1="178" x2="926" y2="196" stroke="#dcb78f" stroke-width="1.3"/>
  <rect x="618" y="196" width="421" height="30" rx="15" fill="#fdfaf6" stroke="#dcb78f" stroke-width="1.3"/>
  <text x="828" y="216" text-anchor="middle" font-size="13" font-weight="600" fill="#a9744a">score = dead bytes / accounting bytes >= blob_gc_ratio</text>

  <!-- ===== delta block design section ===== -->
  <line x1="40" y1="250" x2="1040" y2="250" stroke="#ecedef" stroke-width="1"/>
  <text x="40" y="278" font-size="14.5" font-weight="700" fill="#3a4250">Delta-block query path <tspan fill="#86b29a">(use_delta_block)</tspan>: recover value_size and accumulate dead bytes without reading real vSST values.</text>

  <rect x="40" y="290" width="1000" height="200" rx="9" fill="#f7f9fb" stroke="#cdd8e4" stroke-width="1.2"/>

  <!-- Row 1: kSST data-block entries -->
  <text x="62" y="318" font-size="11.5" fill="#5d769a" font-weight="600">kSST data-block entries</text>
  <g font-size="11.5">
    <rect x="250" y="326" width="96" height="34" rx="5" fill="#fff" stroke="#9bb4d0" stroke-width="1.2"/>
    <line x1="285" y1="326" x2="285" y2="360" stroke="#dde4ec"/>
    <text x="268" y="347" text-anchor="middle" fill="#7a8593">K0</text><text x="318" y="347" text-anchor="middle" fill="#a9744a" font-weight="600">→vSST</text>
    <rect x="365" y="326" width="96" height="34" rx="5" fill="#fbfbfc" stroke="#cfd6db" stroke-width="1.2"/>
    <line x1="400" y1="326" x2="400" y2="360" stroke="#e6e9ec"/>
    <text x="383" y="347" text-anchor="middle" fill="#7a8593">K1</text><text x="433" y="347" text-anchor="middle" fill="#9aa3ad">inline</text>
    <rect x="480" y="326" width="96" height="34" rx="5" fill="#fff" stroke="#9bb4d0" stroke-width="1.2"/>
    <line x1="515" y1="326" x2="515" y2="360" stroke="#dde4ec"/>
    <text x="498" y="347" text-anchor="middle" fill="#7a8593">K2</text><text x="548" y="347" text-anchor="middle" fill="#a9744a" font-weight="600">→vSST</text>
    <rect x="595" y="326" width="96" height="34" rx="5" fill="#fff" stroke="#9bb4d0" stroke-width="1.2"/>
    <line x1="630" y1="326" x2="630" y2="360" stroke="#dde4ec"/>
    <text x="613" y="347" text-anchor="middle" fill="#7a8593">K3</text><text x="663" y="347" text-anchor="middle" fill="#a9744a" font-weight="600">→vSST</text>
  </g>

  <!-- alignment dotted lines to bitmap -->
  <g stroke="#c2ccd8" stroke-width="1" stroke-dasharray="3 3">
    <line x1="298" y1="360" x2="298" y2="382"/>
    <line x1="413" y1="360" x2="413" y2="382"/>
    <line x1="528" y1="360" x2="528" y2="382"/>
    <line x1="643" y1="360" x2="643" y2="382"/>
  </g>

  <!-- Row 2: separated bitmap (meta block) -->
  <text x="62" y="396" font-size="11.5" fill="#5d769a" font-weight="600">separated_bitmap</text>
  <text x="62" y="412" font-size="9.5" fill="#9aa3ad">meta block · no keys</text>
  <g font-size="13" font-weight="700">
    <rect x="276" y="382" width="44" height="26" rx="4" fill="#d5e6db" stroke="#86b29a" stroke-width="1.1"/><text x="298" y="400" text-anchor="middle" fill="#4f7a62">1</text>
    <rect x="391" y="382" width="44" height="26" rx="4" fill="#eef1f3" stroke="#c2cad3" stroke-width="1.1"/><text x="413" y="400" text-anchor="middle" fill="#9aa3ad">0</text>
    <rect x="506" y="382" width="44" height="26" rx="4" fill="#d5e6db" stroke="#86b29a" stroke-width="1.1"/><text x="528" y="400" text-anchor="middle" fill="#4f7a62">1</text>
    <rect x="621" y="382" width="44" height="26" rx="4" fill="#d5e6db" stroke="#86b29a" stroke-width="1.1"/><text x="643" y="400" text-anchor="middle" fill="#4f7a62">1</text>
  </g>
  <text x="672" y="400" font-size="10.5" fill="#9aa3ad">1=separated · 0=inline</text>

  <!-- rank arrows from set bits to value_size cells -->
  <g stroke="#7a9bbf" stroke-width="1.3" fill="none">
    <path d="M298,408 C298,418 298,418 298,428" marker-end="url(#arq)"/>
    <path d="M528,408 C528,418 413,418 413,428" marker-end="url(#arq)"/>
    <path d="M643,408 C643,418 528,418 528,428" marker-end="url(#arq)"/>
  </g>
  <text x="590" y="442" font-size="10.5" fill="#7a9bbf">idx = rank1(i) → value_size[idx]</text>

  <!-- Row 3: value_size array (delta data block) -->
  <text x="62" y="446" font-size="11.5" fill="#5d769a" font-weight="600">value_size[]</text>
  <text x="62" y="462" font-size="9.5" fill="#9aa3ad">delta data block</text>
  <g font-size="11.5">
    <text x="298" y="424" text-anchor="middle" font-size="9.5" fill="#9aa3ad">[0]</text>
    <text x="413" y="424" text-anchor="middle" font-size="9.5" fill="#9aa3ad">[1]</text>
    <text x="528" y="424" text-anchor="middle" font-size="9.5" fill="#9aa3ad">[2]</text>
    <rect x="270" y="428" width="56" height="26" rx="4" fill="#faf0e4" stroke="#dcb78f" stroke-width="1.1"/><text x="298" y="446" text-anchor="middle" fill="#a9744a" font-weight="600">120 B</text>
    <rect x="385" y="428" width="56" height="26" rx="4" fill="#faf0e4" stroke="#dcb78f" stroke-width="1.1"/><text x="413" y="446" text-anchor="middle" fill="#a9744a" font-weight="600">4 KB</text>
    <rect x="500" y="428" width="56" height="26" rx="4" fill="#faf0e4" stroke="#dcb78f" stroke-width="1.1"/><text x="528" y="446" text-anchor="middle" fill="#a9744a" font-weight="600">800 B</text>
    <text x="590" y="462" font-size="10.5" fill="#9aa3ad">compact storage for separated entries only</text>
  </g>

  <!-- Right query recipe -->
  <rect x="752" y="312" width="272" height="160" rx="7" fill="#fff" stroke="#cdd8e4" stroke-width="1.1"/>
  <text x="770" y="334" font-size="11.5" font-weight="700" fill="#5d769a">GC byte query per entry (no vSST I/O)</text>
  <g font-size="11" fill="#5b6470">
    <text x="770" y="358"><tspan fill="#7a9bbf" font-weight="700">①</tspan> read entry i</text>
    <text x="770" y="380"><tspan fill="#7a9bbf" font-weight="700">②</tspan> bitmap[i] = 0: skip</text>
    <text x="770" y="402"><tspan fill="#7a9bbf" font-weight="700">③</tspan> bitmap[i] = 1: idx = rank1(i)</text>
    <text x="770" y="424"><tspan fill="#7a9bbf" font-weight="700">④</tspan> size = value_size[idx]</text>
    <text x="770" y="446"><tspan fill="#c98079" font-weight="700">⑤</tspan> if entry is dead: dead_bytes += size</text>
  </g>
  <text x="770" y="466" font-size="10.5" fill="#a9744a" font-weight="600">→ dead_bytes / accounting_bytes</text>

  <!-- ===== mixed-size comparison ===== -->
  <line x1="40" y1="514" x2="1040" y2="514" stroke="#ecedef" stroke-width="1"/>
  <text x="40" y="542" font-size="14.5" font-weight="700" fill="#3a4250">Mixed-size values: dead-entry ratio != reclaimable-byte ratio</text>

  <!-- shared physical bars (left) -->
  <text x="40" y="566" font-size="11" fill="#9aa3ad">Actual vSST layout (same file, two interpretations)</text>
  <text x="40" y="600" font-size="12" fill="#5b6470">vSST&#8209;A</text>
  <g>
    <rect x="105" y="585" width="13" height="22" fill="#e0a39d"/><rect x="119" y="585" width="13" height="22" fill="#e0a39d"/>
    <rect x="133" y="585" width="13" height="22" fill="#e0a39d"/><rect x="147" y="585" width="13" height="22" fill="#e0a39d"/>
    <rect x="161" y="585" width="13" height="22" fill="#e0a39d"/>
    <rect x="175" y="585" width="140" height="22" fill="#cfd6db"/>
  </g>
  <text x="320" y="600" font-size="11" fill="#9aa3ad">5 dead small values</text>

  <text x="40" y="640" font-size="12" fill="#5b6470">vSST&#8209;B</text>
  <g>
    <rect x="105" y="625" width="74" height="22" fill="#e0a39d"/>
    <rect x="180" y="625" width="74" height="22" fill="#e0a39d"/>
    <rect x="255" y="625" width="60" height="22" fill="#cfd6db"/>
  </g>
  <text x="320" y="640" font-size="11" fill="#9aa3ad">2 dead large values</text>

  <rect x="105" y="663" width="14" height="12" fill="#e0a39d"/><text x="125" y="673" font-size="11" fill="#9aa3ad">dead / reclaimable bytes</text>
  <rect x="255" y="663" width="14" height="12" fill="#cfd6db"/><text x="275" y="673" font-size="11" fill="#9aa3ad">live / still referenced</text>

  <!-- vertical divider -->
  <line x1="470" y1="554" x2="470" y2="680" stroke="#ecedef" stroke-width="1"/>

  <!-- two readings (right) -->
  <rect x="500" y="560" width="540" height="56" rx="8" fill="#f6f7f8" stroke="#d4d8dd" stroke-width="1.2"/>
  <text x="520" y="584" font-size="12.5" font-weight="700" fill="#6b7480">Entry-based · count dead entries only</text>
  <text x="520" y="605" font-size="12" fill="#5b6470">A: 5 entries &gt; B: 2 entries</text>
  <text x="700" y="605" font-size="12.5" font-weight="700" fill="#c98079">→ picks vSST&#8209;A  ✗ wrong</text>

  <rect x="500" y="624" width="540" height="56" rx="8" fill="#faf4ec" stroke="#dcb78f" stroke-width="1.3"/>
  <text x="520" y="648" font-size="12.5" font-weight="700" fill="#a9744a">Byte-precise · count dead bytes</text>
  <text x="520" y="669" font-size="12" fill="#5b6470">B bytes &gt; A bytes</text>
  <text x="700" y="669" font-size="12.5" font-weight="700" fill="#6fa382">→ picks vSST&#8209;B  ✓ best benefit</text>
</svg>
