<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 470" font-family="'Helvetica Neue','Noto Sans CJK SC','PingFang SC','Microsoft YaHei',Arial,sans-serif">
  <defs>
    <marker id="arg" markerWidth="8" markerHeight="8" refX="5.5" refY="2.8" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L5.8,2.8 L0,5.6 Z" fill="#9b8fd0"/>
    </marker>
  </defs>

  <!-- title -->
  <text x="30" y="34" font-size="18" font-weight="700" fill="#3a4250">GC-Aware Block Cache</text>
  <text x="30" y="54" font-size="12" fill="#9aa3ad">Demote and evict vSST blocks made obsolete by Blob GC, keeping cache capacity for live hot data.</text>

  <!-- ============ LEFT: plain LRU problem ============ -->
  <text x="40" y="92" font-size="13" font-weight="700" fill="#6b7480">Plain LRU</text>
  <text x="40" y="110" font-size="10.5" fill="#9aa3ad">No file-obsolescence signal</text>
  <rect x="40" y="120" width="300" height="250" rx="10" fill="#f6f7f8" stroke="#cbd2d9" stroke-width="1.3"/>
  <text x="56" y="142" font-size="11" fill="#7b8392">Ordered by recent access, independent of obsolescence</text>

  <!-- LRU stack: mixed obsolete (red) and live (gray) -->
  <g>
    <rect x="60" y="156" width="260" height="26" rx="4" fill="#e6a9a3"/><text x="74" y="173" font-size="11" fill="#7c3b35">obsolete block (rewritten by GC)</text>
    <rect x="60" y="186" width="260" height="26" rx="4" fill="#cfd6db"/><text x="74" y="203" font-size="11" fill="#566069">live hot block</text>
    <rect x="60" y="216" width="260" height="26" rx="4" fill="#e6a9a3"/><text x="74" y="233" font-size="11" fill="#7c3b35">obsolete block</text>
    <rect x="60" y="246" width="260" height="26" rx="4" fill="#e6a9a3"/><text x="74" y="263" font-size="11" fill="#7c3b35">obsolete block</text>
    <rect x="60" y="276" width="260" height="26" rx="4" fill="#cfd6db"/><text x="74" y="293" font-size="11" fill="#566069">live hot block</text>
    <rect x="60" y="306" width="260" height="26" rx="4" fill="#e6a9a3"/><text x="74" y="323" font-size="11" fill="#7c3b35">obsolete block</text>
  </g>
  <text x="56" y="356" font-size="11" fill="#b96b62" font-weight="600">Recently accessed obsolete blocks linger and pollute hit rate</text>

  <!-- ============ CENTER: GC notify ============ -->
  <g>
    <rect x="372" y="206" width="176" height="78" rx="9" fill="#f3f1fb" stroke="#9b8fd0" stroke-width="1.5"/>
    <text x="460" y="230" text-anchor="middle" font-size="12" font-weight="700" fill="#6a5aa8">Blob GC</text>
    <text x="460" y="251" text-anchor="middle" font-size="10" fill="#7b8392">rewrite live values · retire old vSST</text>
    <text x="460" y="271" text-anchor="middle" font-size="10" fill="#9b8fd0">MarkFilesObsolete(file_no)</text>
  </g>
  <text x="350" y="200" font-size="20" fill="#cbd2d9">↦</text>
  <path d="M548,228 C580,228 580,180 612,176" fill="none" stroke="#9b8fd0" stroke-width="1.4" stroke-dasharray="5 3" marker-end="url(#arg)"/>
  <path d="M548,262 C580,262 580,308 612,312" fill="none" stroke="#9b8fd0" stroke-width="1.4" stroke-dasharray="5 3" marker-end="url(#arg)"/>
  <text x="556" y="200" font-size="9.5" fill="#9b8fd0">demote</text>

  <!-- ============ RIGHT: GarbageAwareCache two zones ============ -->
  <text x="612" y="92" font-size="13" font-weight="700" fill="#4f7a62">GarbageAwareCache</text>
  <text x="612" y="110" font-size="10.5" fill="#9aa3ad">Partitioned by GC obsolescence signal</text>
  <rect x="612" y="120" width="276" height="250" rx="10" fill="#f7faf8" stroke="#9cc4ac" stroke-width="1.4"/>

  <!-- score formula chip -->
  <rect x="628" y="132" width="244" height="26" rx="13" fill="#fff" stroke="#9cc4ac" stroke-width="1.1"/>
  <text x="750" y="149" text-anchor="middle" font-size="11" fill="#4f7a62">score = freq · (1 − garbage_ratio)</text>

  <!-- admission zone -->
  <rect x="628" y="166" width="244" height="92" rx="7" fill="#eef6f0" stroke="#bcd6c6" stroke-width="1.1"/>
  <text x="642" y="184" font-size="11" font-weight="700" fill="#4f7a62">admission zone <tspan font-size="10" fill="#4f7a62">score ≥ τ</tspan></text>
  <text x="642" y="200" font-size="9.5" fill="#9aa3ad">high-score hot blocks stay resident</text>
  <rect x="642" y="208" width="216" height="18" rx="3" fill="#cfd6db"/><text x="654" y="221" font-size="10" fill="#566069">live hot block (high score)</text>
  <rect x="642" y="230" width="216" height="18" rx="3" fill="#cfd6db"/><text x="654" y="243" font-size="10" fill="#566069">live hot block (high score)</text>

  <!-- demote zone -->
  <rect x="628" y="266" width="244" height="90" rx="7" fill="#fbeeec" stroke="#e0c0bb" stroke-width="1.1"/>
  <text x="642" y="284" font-size="11" font-weight="700" fill="#b96b62">demotion zone <tspan font-size="10" fill="#b96b62">score &lt; τ</tspan></text>
  <text x="642" y="300" font-size="9.5" fill="#9aa3ad">obsolete ⇒ garbage_ratio→1, score→0</text>
  <rect x="642" y="306" width="160" height="18" rx="3" fill="#e6a9a3"/><text x="654" y="319" font-size="10" fill="#7c3b35">obsolete block score→0</text>
  <text x="810" y="319" font-size="13" fill="#b96b62">✗</text>
  <rect x="642" y="328" width="120" height="18" rx="3" fill="#e6a9a3"/><text x="654" y="341" font-size="10" fill="#7c3b35">obsolete block score→0</text>
  <text x="772" y="341" font-size="13" fill="#b96b62">✗</text>
  <text x="642" y="352" font-size="9.5" fill="#9aa3ad">Under pressure, evict lowest scores first →</text>

  <!-- bottom outcome + ablation note -->
  <line x1="40" y1="396" x2="888" y2="396" stroke="#ecedef" stroke-width="1"/>
  <text x="40" y="420" font-size="11.5" fill="#5b6470"><tspan font-weight="700" fill="#4f7a62">Effect</tspan>: GC-obsolete blocks are freed quickly; useful hot data regains cache space; high-priority index/filter blocks remain protected.</text>
  <g font-size="10.5">
    <rect x="40" y="436" width="11" height="11" rx="2" fill="#9b8fd0"/><text x="56" y="445" fill="#5b6470">use_gc_aware_block_cache (active eviction policy)</text>
    <rect x="360" y="436" width="11" height="11" rx="2" fill="#cbd2d9"/><text x="376" y="445" fill="#5b6470">block_cache_obsolete_tracking (diagnostic residency sampling)</text>
  </g>
</svg>
