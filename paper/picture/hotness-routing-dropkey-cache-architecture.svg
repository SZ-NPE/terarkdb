<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" font-family="'Helvetica Neue','Noto Sans CJK SC','PingFang SC','Microsoft YaHei',Arial,sans-serif">
  <defs>
    <marker id="ar" markerWidth="8" markerHeight="8" refX="5.5" refY="2.8" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L5.8,2.8 L0,5.6 Z" fill="#8a96a3"/>
    </marker>
    <marker id="arh" markerWidth="8" markerHeight="8" refX="5.5" refY="2.8" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L5.8,2.8 L0,5.6 Z" fill="#c98079"/>
    </marker>
    <marker id="arv" markerWidth="8" markerHeight="8" refX="5.5" refY="2.8" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L5.8,2.8 L0,5.6 Z" fill="#9b8fd0"/>
    </marker>
  </defs>

  <!-- title -->
  <text x="30" y="34" font-size="18" font-weight="700" fill="#3a4250">Hotness-Driven Routing &amp; GC Pruning</text>
  <text x="30" y="54" font-size="12" fill="#9aa3ad">One HotnessTracker drives flush hot/cold routing and Blob-GC reverse-lookup short-circuiting.</text>

  <!-- ===== central tracker ===== -->
  <rect x="346" y="186" width="208" height="84" rx="9" fill="#f3f1fb" stroke="#9b8fd0" stroke-width="1.6"/>
  <text x="450" y="216" text-anchor="middle" font-size="14" font-weight="700" fill="#6a5aa8">HotnessTracker</text>
  <text x="450" y="240" text-anchor="middle" font-size="11" fill="#7b8392">background feedback heat</text>
  <text x="450" y="258" text-anchor="middle" font-size="10.5" fill="#9aa3ad">routing buckets + exact dropped seqs</text>

  <!-- ===== left: write ===== -->
  <rect x="30" y="196" width="120" height="64" rx="8" fill="#eef2f7" stroke="#9fb3cb" stroke-width="1.4"/>
  <text x="90" y="224" text-anchor="middle" font-size="12.5" font-weight="700" fill="#4f6b88">Write</text>
  <text x="90" y="244" text-anchor="middle" font-size="10.5" fill="#7b8392">Put / Merge</text>
  <line x1="150" y1="228" x2="344" y2="228" stroke="#8a96a3" stroke-width="1.6" marker-end="url(#ar)"/>
  <text x="247" y="221" text-anchor="middle" font-size="10" fill="#9aa3ad">no foreground learning</text>

  <!-- ===== A: flush routing (top-right) ===== -->
  <text x="610" y="92" font-size="12.5" font-weight="700" fill="#b96b62">A. Flush hot/cold routing</text>
  <rect x="610" y="102" width="270" height="40" rx="7" fill="#fbeeec" stroke="#d8a59e" stroke-width="1.3"/>
  <text x="624" y="119" font-size="11" font-weight="700" fill="#b96b62">hot vSST</text>
  <rect x="624" y="124" width="22" height="12" fill="#e0a39d"/><rect x="648" y="124" width="22" height="12" fill="#e0a39d"/><rect x="672" y="124" width="22" height="12" fill="#e0a39d"/><rect x="696" y="124" width="34" height="12" fill="#cfd6db"/>
  <text x="742" y="134" font-size="9.5" fill="#b96b62">concentrated garbage</text>
  <rect x="610" y="150" width="270" height="40" rx="7" fill="#eef3f7" stroke="#a8c0d4" stroke-width="1.3"/>
  <text x="624" y="167" font-size="11" font-weight="700" fill="#5f7e9c">cold vSST</text>
  <rect x="624" y="172" width="12" height="12" fill="#e0a39d"/><rect x="638" y="172" width="92" height="12" fill="#cfd6db"/>
  <text x="742" y="182" font-size="9.5" fill="#5f7e9c">low garbage, less relocation</text>
  <path d="M540,202 C575,170 575,128 608,122" fill="none" stroke="#c98079" stroke-width="1.5" marker-end="url(#arh)"/>
  <path d="M544,210 C585,185 575,168 608,172" fill="none" stroke="#6b8aa8" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="566" y="158" font-size="9.5" fill="#9aa3ad">ClassifyForFlush</text>

  <!-- ===== B: compaction feedback (bottom-right) ===== -->
  <text x="610" y="324" font-size="12.5" font-weight="700" fill="#7a9bbf">B. Compaction feedback</text>
  <rect x="610" y="334" width="270" height="56" rx="8" fill="#f7f9fb" stroke="#cdd8e4" stroke-width="1.2"/>
  <text x="624" y="356" font-size="11" fill="#5b6470">dead old version (key, seq)</text>
  <text x="624" y="377" font-size="10.5" fill="#5b6470"><tspan fill="#b96b62" font-weight="700">promote hot</tspan> · <tspan fill="#7a9bbf" font-weight="700">record dropped_seq</tspan></text>
  <path d="M690,334 C650,300 600,275 556,252" fill="none" stroke="#9b8fd0" stroke-width="1.4" stroke-dasharray="5 3" marker-end="url(#arv)"/>
  <text x="600" y="290" font-size="9.5" fill="#9b8fd0">feedback</text>

  <!-- ===== C: GC short-circuit (bottom-left) ===== -->
  <text x="30" y="324" font-size="12.5" font-weight="700" fill="#6a5aa8">C. Blob-GC reverse-lookup shortcut</text>
  <rect x="30" y="334" width="116" height="56" rx="8" fill="#fbeeec" stroke="#d8a59e" stroke-width="1.3"/>
  <text x="88" y="358" text-anchor="middle" font-size="11.5" font-weight="700" fill="#b96b62">GC scan</text>
  <text x="88" y="377" text-anchor="middle" font-size="10" fill="#7b8392">(key, seq)</text>
  <path d="M214,362 L260,336 L306,362 L260,388 Z" fill="#f3f1fb" stroke="#9b8fd0" stroke-width="1.4"/>
  <text x="260" y="366" text-anchor="middle" font-size="10.5" font-weight="700" fill="#6a5aa8">IsDropped?</text>
  <line x1="146" y1="362" x2="212" y2="362" stroke="#8a96a3" stroke-width="1.6" marker-end="url(#ar)"/>
  <path d="M260,336 C300,285 390,262 398,256" fill="none" stroke="#9b8fd0" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#arv)"/>
  <text x="306" y="300" font-size="9.5" fill="#9b8fd0">check dropped_seqs</text>
  <rect x="346" y="326" width="208" height="32" rx="6" fill="#eef6f0" stroke="#9cc4ac" stroke-width="1.3"/>
  <text x="360" y="346" font-size="10.5" fill="#4f7a62"><tspan font-weight="700">HIT</tspan> → dead, skip lookup O(1)</text>
  <line x1="306" y1="356" x2="344" y2="344" stroke="#6fa382" stroke-width="1.4" marker-end="url(#ar)"/>
  <rect x="346" y="366" width="208" height="32" rx="6" fill="#f6f7f8" stroke="#cbd2d9" stroke-width="1.2"/>
  <text x="360" y="386" font-size="10.5" fill="#6b7480"><tspan font-weight="700">MISS</tspan> → fallback to expensive GetKey()</text>
  <line x1="306" y1="366" x2="344" y2="380" stroke="#8a96a3" stroke-width="1.4" marker-end="url(#ar)"/>

  <!-- ===== legend ===== -->
  <line x1="30" y1="414" x2="870" y2="414" stroke="#ecedef" stroke-width="1"/>
  <g font-size="10.5">
    <rect x="30" y="426" width="11" height="11" rx="2" fill="#9fb3cb"/><text x="46" y="435" fill="#5b6470">write_window</text>
    <rect x="158" y="426" width="11" height="11" rx="2" fill="#d8a59e"/><text x="174" y="435" fill="#5b6470">compaction_feedback</text>
    <rect x="338" y="426" width="11" height="11" rx="2" fill="#7a9bbf"/><text x="354" y="435" fill="#5b6470">drop_key_cache</text>
    <rect x="488" y="426" width="11" height="11" rx="2" fill="#9b8fd0"/><text x="504" y="435" fill="#5b6470">enable_hotness_tracker (main switch)</text>
    <text x="712" y="435" fill="#9aa3ad">flush routing only · no false hit</text>
  </g>
</svg>
